[versions]
spring-boot                = "3.5.0"
springBootAdmin            = "3.4.3"
spring-cloud               = "2025.0.0"
spring-dependency-mgmt     = "1.1.6"
caffeine                   = "3.1.8"
keycloak-admin             = "25.0.6"
springdoc                  = "2.6.0"
spotbugs-plugin            = "6.0.15"
spotbugs-tool              = "4.8.6"
testcontainers-keycloak    = "3.4.0"
wiremock                   = "3.9.1"

[libraries]
# --- Managed by Spring Boot BOM; no version needed ---
spring-boot-starter-security              = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-web                   = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa              = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test                  = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka                              = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test                         = { module = "org.springframework.kafka:spring-kafka-test" }
flyway-core                               = { module = "org.flywaydb:flyway-core" }
flyway-postgres                           = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql                                = { module = "org.postgresql:postgresql" }
hibernate-envers                          = { module = "org.hibernate.orm:hibernate-envers" }
testcontainers-junit                      = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql                 = { module = "org.testcontainers:postgresql" }
testcontainers-kafka                      = { module = "org.testcontainers:kafka" }

# --- Versioned outside Spring Boot BOM ---
caffeine                   = { module = "com.github.ben-manes.caffeine:caffeine",              version.ref = "caffeine" }
keycloak-admin-client      = { module = "org.keycloak:keycloak-admin-client",                  version.ref = "keycloak-admin" }
springdoc-openapi-webmvc   = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui",   version.ref = "springdoc" }
testcontainers-keycloak    = { module = "com.github.dasniko:testcontainers-keycloak",          version.ref = "testcontainers-keycloak" }
wiremock                   = { module = "org.wiremock:wiremock-standalone",                     version.ref = "wiremock" }
spring-cloud-gateway       = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-boot-admin-server   = { group = "de.codecentric", name = "spring-boot-admin-starter-server", version.ref = "springBootAdmin" }
spring-boot-admin-client   = { group = "de.codecentric", name = "spring-boot-admin-starter-client", version.ref = "springBootAdmin" }

[plugins]
spring-boot                = { id = "org.springframework.boot",          version.ref = "spring-boot" }
spring-dependency-mgmt     = { id = "io.spring.dependency-management",   version.ref = "spring-dependency-mgmt" }
spotbugs                   = { id = "com.github.spotbugs",               version.ref = "spotbugs-plugin" }
