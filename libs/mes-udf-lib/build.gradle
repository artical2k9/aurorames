// mes-udf-lib — Reusable User-Defined Fields framework for Aurora MES.
// Provides UdfFieldDefinition JPA entity, UdfValidator service, and REST controller
// autoconfiguration. Published to mavenLocal(); consumed by work-order-service and
// future domain services that require org-scoped custom fields.

plugins {
    id 'java-library'
}

// Spring Framework 6 requires parameter names in bytecode to resolve @RequestParam /
// @PathVariable without explicit annotation values. The Spring Boot Gradle plugin adds
// this flag automatically for service modules, but library modules must add it explicitly.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

dependencies {
    // ── JPA — UdfFieldDefinition entity and repository ────────────────────────
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ── Envers — @Audited on UdfFieldDefinition ───────────────────────────────
    api libs.hibernate.envers

    // ── Web — REST controller for /udf/fields endpoint ────────────────────────
    api 'org.springframework.boot:spring-boot-starter-web'

    // ── Validation — Bean Validation on UDF definition DTOs ──────────────────
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── JSONB — list_options and validation_rules stored as JSONB ─────────────
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.0'

    // ── Jackson ───────────────────────────────────────────────────────────────
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── Autoconfiguration support ─────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly    'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ── Privilege annotation — provided by consuming service at runtime ───────
    compileOnly project(':libs:lib-common-security')

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

apply plugin: 'maven-publish'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId    = 'com.mes'
            artifactId = 'mes-udf-lib'
            version    = project.version
            versionMapping {
                usage('java-api') { fromResolutionOf('runtimeClasspath') }
                usage('java-runtime') { fromResolutionResult() }
            }
        }
    }
}
