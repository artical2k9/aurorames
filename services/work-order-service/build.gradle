// work-order-service — Work-order schema owner for Aurora MES.
// Domain packages (ItemMaster, BOM, ECO, Preferences) migrated to inventory-service,
// engineering-service, and platform-service in MES-111.

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // ── Shared libraries ──────────────────────────────────────────────────────
    implementation project(':libs:lib-common-security')
    implementation project(':libs:lib-common-audit')

    // ── Spring Boot Admin client self-registration ────────────────────────────
    implementation libs.spring.boot.admin.client

    // ── Web + Persistence + Validation ───────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── Flyway ────────────────────────────────────────────────────────────────
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── PostgreSQL driver ─────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── Jackson ───────────────────────────────────────────────────────────────
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── API documentation ─────────────────────────────────────────────────────
    implementation libs.springdoc.openapi.webmvc

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation(testFixtures(project(':libs:lib-common-security')))
}

// Copy IAM service migrations to iam-bootstrap/ in the test classpath so
// BaseIntegrationTest.bootstrapIamSchema() can prime the iam.* tables before
// work-order-service's own Flyway runs V007 (which INSERTs into iam.privilege).
processTestResources {
    from('../iam-service/src/main/resources/db/migration') {
        into 'iam-bootstrap'
    }
}

test {
    def dockerHost = System.getenv('DOCKER_HOST')
    if (dockerHost) {
        environment 'DOCKER_HOST', dockerHost
        systemProperty 'api.version', '1.41'
    }
}
