// routing-service — Manufacturing Routing for Aurora MES (ISA-95 Operations Definition).
// Owns the `routing` PostgreSQL schema: route headers, operations, groups, steps,
// approvals (e-signature), two-tier revisioning, and the routing reference-data
// Settings submodule (work centres, labour codes, labour activity/plan types,
// route types, significant-process types, suppliers). Prerequisite for Work Orders
// (MES-14) and Shop Floor Tracking (MES-15).

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // ── Shared libraries ──────────────────────────────────────────────────────
    implementation project(':libs:lib-common-security')
    implementation project(':libs:lib-common-audit')
    implementation project(':libs:mes-udf-lib')

    // ── Spring Boot Admin client self-registration ────────────────────────────
    implementation libs.spring.boot.admin.client

    // ── Web + Persistence + Validation ───────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── Flyway ────────────────────────────────────────────────────────────────
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── Kafka — emit routing.route.approved; consume upstream revision.superseded ─
    implementation 'org.springframework.kafka:spring-kafka'

    // ── PostgreSQL driver ─────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── JSONB ─────────────────────────────────────────────────────────────────
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.0'

    // ── Jackson ───────────────────────────────────────────────────────────────
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── API documentation ─────────────────────────────────────────────────────
    implementation libs.springdoc.openapi.webmvc

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation(testFixtures(project(':libs:lib-common-security')))
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// Copy IAM service migrations to iam-bootstrap/ in the test classpath so
// BaseIntegrationTest can prime the iam.* tables before routing-service's own
// Flyway runs the privilege seed (which INSERTs into iam.privilege). (ERR-MES-061 pattern)
processTestResources {
    from('../iam-service/src/main/resources/db/migration') {
        into 'iam-bootstrap'
    }
}

test {
    def dockerHost = System.getenv('DOCKER_HOST')
    if (dockerHost) {
        environment 'DOCKER_HOST', dockerHost
        systemProperty 'api.version', '1.41'
    }
}
