spring:
  application:
    name: platform-service
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/mes?currentSchema=platform}
    username: ${PLATFORM_DB_USER:platform_user}
    password: ${PLATFORM_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: platform
    default-schema: platform
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform
        dialect: org.hibernate.dialect.PostgreSQLDialect
  boot:
    admin:
      client:
        url: ${ADMIN_SERVICE_URL:http://admin-service:8888}
        instance:
          prefer-ip: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mes}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: platform-service

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized

mes:
  security:
    webhook-token: ${MES_SECURITY_WEBHOOK_TOKEN:changeme}
    iam-service-url: ${IAM_SERVICE_URL:http://iam-service:8080}
    privilege-cache-ttl-seconds: ${PRIVILEGE_CACHE_TTL_SECONDS:300}
