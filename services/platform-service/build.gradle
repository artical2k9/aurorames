// platform-service — Per-organisation system configuration (key/value store).
// Exposes CRUD via JWT-protected REST API and an internal webhook-token endpoint.

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // ── Shared security library ───────────────────────────────────────────────
    implementation project(':libs:lib-common-security')

    // ── Spring Boot Admin client self-registration ────────────────────────────
    implementation libs.spring.boot.admin.client

    // ── Web + Persistence + Flyway ────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly    'org.postgresql:postgresql'

    // ── Kafka — privilege cache invalidation (via lib-common-security) ────────
    implementation 'org.springframework.kafka:spring-kafka'

    // ── API documentation ─────────────────────────────────────────────────────
    implementation libs.springdoc.openapi.webmvc

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
