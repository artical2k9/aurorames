server:
  port: 8090

spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AUDIT_DB_NAME:mikemes}
    username: ${AUDIT_SERVICE_DB_USERNAME:audit_service}
    password: ${AUDIT_SERVICE_DB_PASSWORD:changeme}

  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AUDIT_DB_NAME:mikemes}
    user: ${AUDIT_FLYWAY_DB_USERNAME:audit_flyway}
    password: ${AUDIT_FLYWAY_DB_PASSWORD:changeme}
    schemas: audit
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
        envers:
          audit_strategy: org.hibernate.envers.strategy.ValidityAuditStrategy
          audit_strategy_validity_end_rev_field_name: REVEND
          audit_strategy_validity_revend_timestamp_field_name: REVEND_TSTMP
          audit_strategy_validity_store_revend_timestamp: true
          revision_field_name: rev
          revision_type_field_name: revtype
          store_data_at_delete: true

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: ${AUDIT_KAFKA_CONSUMER_GROUP:audit-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mikemes.events.audit"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/mikemes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

audit:
  health:
    kafka-lag-threshold: ${AUDIT_HEALTH_KAFKA_LAG_THRESHOLD:1000}

spring.boot.admin.client:
  url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8085}
  instance:
    service-base-url: ${AUDIT_SERVICE_URL:http://localhost:8090}
