spring:
  application:
    name: labour-service

  # labour-service owns its own SecurityFilterChain (SecurityConfig). Exclude the shared lib's
  # auto-configuration to prevent two "any request" filter chains conflicting under
  # Spring Security 6.5+ (Spring Boot 3.5.0 added UnreachableFilterChainException enforcement).
  autoconfigure:
    exclude:
      - com.mes.common.security.config.MESSecurityAutoConfiguration

  datasource:
    url: ${LABOUR_DB_URL:jdbc:postgresql://localhost:5432/mes?currentSchema=labour}
    username: ${LABOUR_DB_USER:labour_user}
    password: ${LABOUR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: labour
    default-schema: labour
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: labour
        dialect: org.hibernate.dialect.PostgreSQLDialect
        org.hibernate.envers.default_schema: labour
        org.hibernate.envers.audit_table_schema: labour
        envers:
          audit_strategy: org.hibernate.envers.strategy.ValidityAuditStrategy
          audit_strategy_validity_end_rev_field_name: REVEND
          audit_strategy_validity_revend_timestamp_field_name: REVEND_TSTMP
          audit_strategy_validity_store_revend_timestamp: true
          revision_field_name: rev
          revision_type_field_name: revtype

  boot:
    admin:
      client:
        url: ${ADMIN_SERVICE_URL:http://admin-service:8888}
        instance:
          prefer-ip: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mes}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8080/realms/mes}

  # Kafka consumer — listens for iam.user.created to create the linked employee record.
  # iam-service publishes the payload as a JSON string, so we use String deserializers and
  # parse with Jackson in the listener (no type-header coupling).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: labour-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8098

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized

mes:
  security:
    webhook-token: ${MES_SECURITY_WEBHOOK_TOKEN}
    iam-service-url: ${IAM_SERVICE_URL:http://iam-service:8085}
    privilege-cache-ttl-seconds: ${PRIVILEGE_CACHE_TTL_SECONDS:300}
  labour:
    expiry-warning-days: ${LABOUR_EXPIRY_WARNING_DAYS:30}

labour:
  events:
    user-created-topic: ${IAM_USER_CREATED_TOPIC:iam.user.created}
