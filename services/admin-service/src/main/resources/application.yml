spring:
  application:
    name: admin-service
  boot:
    admin:
      server:
        enabled: true
      client:
        url: ${ADMIN_SERVICE_URL:http://admin-service:8888}
        instance:
          prefer-ip: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: admin-service
            client-secret: ${ADMIN_SERVICE_CLIENT_SECRET:changeme}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # Split-horizon Keycloak: the browser reaches KC at the public host while this
            # service reaches it over the Docker network. Configure endpoints explicitly so
            # Spring does NOT run issuer-uri OIDC discovery (which asserts the discovered issuer
            # equals the requested host and crashes the context — KC advertises the public host).
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8080/realms/mes/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/mes/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/mes/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://keycloak:8080/realms/mes/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized
