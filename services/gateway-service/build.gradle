// gateway-service — Spring Cloud Gateway acting as the OAuth2 resource server entry point.
// Validates JWTs, blocks /internal/** paths, and routes authenticated traffic to downstream services.

plugins {
    id 'org.springframework.boot'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
    }
}

dependencies {
    // ── Gateway + security ────────────────────────────────────────────────────
    implementation libs.spring.cloud.gateway
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── Spring Boot Admin client self-registration ────────────────────────────
    implementation libs.spring.boot.admin.client

    // ── Tests ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.wiremock
}
