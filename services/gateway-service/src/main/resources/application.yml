spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mikemes}/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: ${IAM_SERVICE_URL:http://iam-service:8085}
          predicates:
            - Path=/api/iam/**
          filters:
            - StripPrefix=2
        # Future routes — registered as each service is implemented:
        # - id: audit-service
        #   uri: ${AUDIT_SERVICE_URL:http://audit-service:8086}
        #   predicates:
        #     - Path=/api/audit/**
        #   filters:
        #     - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${GATEWAY_PORT:8090}
