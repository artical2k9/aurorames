spring:
  application:
    name: gateway-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVICE_URL:http://admin-service:8888}
        instance:
          prefer-ip: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mes}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8080/realms/mes}
  cloud:
    gateway:
      routes:
        - id: iam-service
          uri: ${IAM_SERVICE_URL:http://iam-service:8085}
          predicates:
            - Path=/api/iam/**
          filters:
            - StripPrefix=2
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8888}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2
        - id: platform-service
          uri: ${PLATFORM_SERVICE_URL:http://platform-service:8090}
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=2
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://audit-service:8091}
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=2
        - id: inventory-service-item-master
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8096}
          predicates:
            - Path=/api/v1/item-master/**
          filters:
            - StripPrefix=0
        - id: inventory-service-boms
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8096}
          predicates:
            - Path=/api/v1/boms/**
          filters:
            - StripPrefix=0
        - id: inventory-service-udf
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8096}
          predicates:
            - Path=/api/v1/udf/**
          filters:
            - StripPrefix=0
        - id: engineering-service-ecos
          uri: ${ENGINEERING_SERVICE_URL:http://engineering-service:8097}
          predicates:
            - Path=/api/v1/ecos/**
          filters:
            - StripPrefix=0
        - id: quality-service-inspection-plans
          uri: ${QUALITY_SERVICE_URL:http://quality-service:8099}
          predicates:
            - Path=/api/v1/inspection-plans/**
          filters:
            - StripPrefix=0
        - id: platform-service-preferences
          uri: ${PLATFORM_SERVICE_URL:http://platform-service:8090}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
        - id: work-order-service
          uri: ${WORK_ORDER_SERVICE_URL:http://work-order-service:8095}
          predicates:
            - Path=/api/v1/work-orders/**
          filters:
            - StripPrefix=0
        - id: labour-service
          uri: ${LABOUR_SERVICE_URL:http://labour-service:8098}
          predicates:
            - Path=/api/v1/labour/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${GATEWAY_PORT:8082}
