<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <!--
      Gradient calibrated against AuroraMES_Logo_2.png pixel samples:
        inner-left face (700,350) → #2283F9  (t ≈ 0%)
        inner-right face(840,350) → #2956BB  (t ≈ 47%)
        outer-right bot (950,490) → #114AB6  (t ≈ 96%)
        apex tip        (768, 95) → #0B38B5  (t ≈ 88%)
      Radial centre biased to the brightest measured point (inner-left face).
    -->
    <!--
      4 stops exactly matching PNG pixel samples:
        t=0%  (centre, inner-left face): #2283F9 ≈ #2A8AFF   measured rgb(34,131,249)
        t=47% (inner-right face 840,350): #2956BB             measured rgb(41,86,187)
        t=88% (apex tip 768,95):          #0B38B5             measured rgb(11,56,181)
        t=100% outer (drives t=96% outer-right-bot): #114AB6  measured rgb(17,74,182)
      Blue channel barely changes 47→96% (187→182); only R/G shift — matches data.
    -->
    <radialGradient id="aMarkGrad" gradientUnits="userSpaceOnUse" cx="700" cy="350" r="300">
      <stop offset="0%"   stop-color="#2A8AFF"/>
      <stop offset="47%"  stop-color="#2956BB"/>
      <stop offset="88%"  stop-color="#0B38B5"/>
      <stop offset="100%" stop-color="#114AB6"/>
    </radialGradient>

    <!-- Star: measured centre #1E5FC6 -->
    <radialGradient id="starGrad" gradientUnits="userSpaceOnUse" cx="768" cy="483" r="72">
      <stop offset="0%"   stop-color="#2A72E0"/>
      <stop offset="55%"  stop-color="#1E5FC6"/>
      <stop offset="100%" stop-color="#1450B4"/>
    </radialGradient>

    <!-- Swoosh arcs: share the same radial family as the A mark -->
    <radialGradient id="swooshGrad" gradientUnits="userSpaceOnUse" cx="768" cy="490" r="300">
      <stop offset="0%"   stop-color="#2268DC"/>
      <stop offset="50%"  stop-color="#1A52C4"/>
      <stop offset="88%"  stop-color="#114AB6"/>
      <stop offset="100%" stop-color="#0E3898"/>
    </radialGradient>
  </defs>

