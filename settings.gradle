pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Auto-provision Java 21 Temurin if not already installed on the host
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mes'

// Phase 0 — IAM Epic (MES-5)
include 'libs:lib-common-security'
include 'services:iam-service'

// Future modules registered here as each Epic is implemented:
include 'services:gateway-service'
include 'services:admin-service'
include 'services:platform-service'
include 'services:audit-service'
include 'libs:lib-common-audit'
include 'libs:lib-common-events'
include 'libs:lib-keycloak-audit-spi'
// include 'libs:lib-common-domain'
// include 'libs:lib-common-test'

// Phase 8 — Item Master & BOM Management (MES-8)
include 'libs:mes-udf-lib'
include 'services:work-order-service'

// MES-111 — Service Decomposition
include 'services:inventory-service'
include 'services:engineering-service'

// MES-11 — Labour Resources & Skills
include 'services:labour-service'

// MES-12 — Quality Inspection Planning
include 'services:quality-service'
