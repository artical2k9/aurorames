sonar.organization=artical2k9
sonar.projectKey=artical2k9_MES
sonar.projectName=Aurora MES

# Stack: Java 21 · Gradle 8.x multi-module · Spring Boot 3.3 microservices
# 16 domain services + 2 infrastructure services + 5 shared libraries

# Sources — only modules that currently exist in the repo.
# Add new modules here when their src/main/java directory is created.
sonar.sources=\
  services/gateway-service/src/main/java,\
  services/iam-service/src/main/java,\
  services/admin-service/src/main/java,\
  services/platform-service/src/main/java,\
  services/audit-service/src/main/java,\
  libs/lib-common-security/src/main/java,\
  libs/lib-common-audit/src/main/java,\
  libs/lib-common-events/src/main/java,\
  libs/lib-keycloak-audit-spi/src/main/java,\
  services/work-order-service/src/main/java,\
  libs/mes-udf-lib/src/main/java

# Tests — mirrors sonar.sources; only existing src/test/java directories.
sonar.tests=\
  services/gateway-service/src/test/java,\
  services/iam-service/src/test/java,\
  services/admin-service/src/test/java,\
  services/platform-service/src/test/java,\
  services/audit-service/src/test/java,\
  libs/lib-common-security/src/test/java,\
  libs/lib-common-audit/src/test/java,\
  libs/lib-common-events/src/test/java,\
  libs/lib-keycloak-audit-spi/src/test/java,\
  services/work-order-service/src/test/java,\
  libs/mes-udf-lib/src/test/java

# Java compiled classes — required by SonarScanner to analyse .java sources
sonar.java.binaries=**/build/classes/java/main

# Java test binaries
sonar.java.test.binaries=**/build/classes/java/test

# Java coverage — JaCoCo aggregate XML report generated by root jacocoRootReport task
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml

# Uncomment once Angular frontend has tests:
# sonar.javascript.lcov.reportPaths=frontend/angular/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/.specify/**,\
  **/.claude/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.git/**,\
  **/specs/**,\
  **/frontend/angular/.angular/**,\
  **/*Migration*.java,\
  **/config/SecurityConfig.java

# Coverage exclusions — Spring Boot application entry points and wiring classes
# require a running container; excluded from JaCoCo for the same reason as homeweb.
sonar.coverage.exclusions=\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/*Repository.java,\
  **/lib-common-test/**

# CPD exclusions — intentionally duplicated infrastructure files pending consolidation.
# WebhookTokenFilter: tracked for lib-common-security migration in MES-28.
# JpaConfig: boilerplate auditing config per service, not shared until a lib-common-jpa module exists.
# *IT.java: integration test classes use structural patterns (bearerRequest, token builders)
#   that look similar across suites but serve different domain contexts; shared helpers
#   are in BaseIntegrationTest so CPD in ITs is already minimal.
sonar.cpd.exclusions=\
  **/filter/WebhookTokenFilter.java,\
  **/config/JpaConfig.java,\
  **/*IT.java

# Encoding
sonar.sourceEncoding=UTF-8
