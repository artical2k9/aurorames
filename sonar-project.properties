# Exclusions — standard ignores; extend per tech stack
sonar.exclusions=\
  **/.specify/**,\
  **/.claude/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.git/**,\
  **/specs/**

# Coverage report paths — add once test framework is established, e.g.:
#   sonar.javascript.lcov.reportPaths=src/coverage/lcov.info
#   sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8
