# Stack: Java 21 · Gradle 8.x multi-module · Spring Boot 3.3 microservices
# 16 domain services + 2 infrastructure services + 5 shared libraries

# Sources — all service and library src/main/java directories.
# Gradle subproject paths follow the services/ and libs/ layout in the constitution.
sonar.sources=\
  services/gateway-service/src/main/java,\
  services/admin-service/src/main/java,\
  services/platform-service/src/main/java,\
  services/audit-service/src/main/java,\
  services/work-order-service/src/main/java,\
  services/shopfloor-service/src/main/java,\
  services/quality-service/src/main/java,\
  services/receiving-service/src/main/java,\
  services/inventory-service/src/main/java,\
  services/engineering-service/src/main/java,\
  services/gauge-tool-service/src/main/java,\
  services/document-service/src/main/java,\
  services/osp-service/src/main/java,\
  services/ncm-service/src/main/java,\
  services/integration-service/src/main/java,\
  services/labour-service/src/main/java,\
  services/iam-service/src/main/java,\
  services/scheduler-service/src/main/java,\
  libs/lib-common-domain/src/main/java,\
  libs/lib-common-security/src/main/java,\
  libs/lib-common-audit/src/main/java,\
  libs/lib-common-events/src/main/java,\
  libs/lib-common-test/src/main/java

# Tests
sonar.tests=\
  services/gateway-service/src/test/java,\
  services/admin-service/src/test/java,\
  services/platform-service/src/test/java,\
  services/audit-service/src/test/java,\
  services/work-order-service/src/test/java,\
  services/shopfloor-service/src/test/java,\
  services/quality-service/src/test/java,\
  services/receiving-service/src/test/java,\
  services/inventory-service/src/test/java,\
  services/engineering-service/src/test/java,\
  services/gauge-tool-service/src/test/java,\
  services/document-service/src/test/java,\
  services/osp-service/src/test/java,\
  services/ncm-service/src/test/java,\
  services/integration-service/src/test/java,\
  services/labour-service/src/test/java,\
  services/iam-service/src/test/java,\
  services/scheduler-service/src/test/java,\
