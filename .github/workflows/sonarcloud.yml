# SonarCloud analysis — runs on every PR and push to main/develop.
# Mirrors the sonarcloud.yml pattern from artical2k9/homeweb.
#
# Stack: Java 21 (Temurin) · Gradle 8.x multi-module · Spring Boot 3.3 microservices
#
# Required secret: SONAR_TOKEN
#   SonarCloud → My Account → Security → Generate Token
#   GitHub repo → Settings → Secrets and variables → Actions → New secret → SONAR_TOKEN
#
# Coverage: JaCoCo aggregate report generated by root `jacocoRootReport` task.
# Add Angular (lcov) coverage once the frontend has tests — see commented block below.

name: SonarCloud

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for blame and new-code detection

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Uncomment once Angular frontend has tests:
      # - name: Set up Node.js 22
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      #     cache: 'npm'
      #     cache-dependency-path: frontend/angular/package-lock.json
      #
      # - name: Install frontend dependencies
      #   working-directory: frontend/angular
      #   run: npm ci
      #
      # - name: Run frontend tests with coverage
      #   working-directory: frontend/angular
      #   run: npm run test:coverage
      #
      # - name: Fix frontend lcov paths for SonarCloud
      #   run: |
      #     sed -i 's|^SF:src/|SF:frontend/angular/src/|g' frontend/angular/coverage/lcov.info

      - name: Build all services and generate JaCoCo coverage
        run: ./gradlew build jacocoRootReport --no-daemon --continue
        # --continue: keep going past test failures so Sonar sees all results
        # jacocoRootReport: aggregates coverage across all Gradle subprojects into
        # build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
