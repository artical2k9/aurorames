# SonarCloud analysis — runs on every PR and push to main.
# Mirrors the sonarcloud.yml pattern from artical2k9/homeweb.
#
# Required secret: SONAR_TOKEN
#   SonarCloud → My Account → Security → Generate Token
#   GitHub repo → Settings → Secrets and variables → Actions → New secret → SONAR_TOKEN
#
# NOTE: No language-specific build or test steps are included yet because the
# MikeMES tech stack has not been finalised. Add test + coverage steps here
# once /speckit-plan establishes the stack, then update sonar-project.properties
# with the coverage report paths.

name: SonarCloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for blame and new-code detection

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
