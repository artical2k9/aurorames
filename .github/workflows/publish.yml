name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  # ── Build Keycloak SPI JAR ──────────────────────────────────────────────────
  # The SPI JAR can't be built inside the Keycloak Dockerfile (Keycloak has no
  # Gradle). Build it here and pass it to the Keycloak image job via artifact.
  build-spi:
    name: Build Keycloak SPI JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build SPI fat JAR
        run: |
          ./gradlew :libs:lib-keycloak-audit-spi:jar --no-daemon -x test
          cp $(ls libs/lib-keycloak-audit-spi/build/libs/lib-keycloak-audit-spi-*.jar \
               | grep -v plain | head -1) \
             libs/lib-keycloak-audit-spi/build/libs/keycloak-spi.jar

      - name: Upload SPI JAR
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-spi-jar
          path: libs/lib-keycloak-audit-spi/build/libs/keycloak-spi.jar
          retention-days: 1

  # ── Build & Push Service Images (parallel) ─────────────────────────────────
  publish-services:
    name: Publish ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: mes-iam-service
            dockerfile: services/iam-service/Dockerfile
          - name: mes-gateway-service
            dockerfile: services/gateway-service/Dockerfile
          - name: mes-admin-service
            dockerfile: services/admin-service/Dockerfile
          - name: mes-platform-service
            dockerfile: services/platform-service/Dockerfile
          - name: mes-audit-service
            dockerfile: services/audit-service/Dockerfile
          - name: mes-work-order-service
            dockerfile: services/work-order-service/Dockerfile
          - name: mes-inventory-service
            dockerfile: services/inventory-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

  # ── Build & Push Keycloak Image ─────────────────────────────────────────────
  publish-keycloak:
    name: Publish mes-keycloak
    needs: [build-spi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SPI JAR
        uses: actions/download-artifact@v4
        with:
          name: keycloak-spi-jar
          path: libs/lib-keycloak-audit-spi/build/libs/

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mes-keycloak
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mes-keycloak
          cache-to: type=gha,scope=mes-keycloak,mode=max
