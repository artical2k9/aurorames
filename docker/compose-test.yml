services:

  # ── PostgreSQL 16 — matches PrivilegeControllerIT container config ─────────
  postgres-test:
    image: postgres:16
    container_name: mes-postgres-test
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_user -d mes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Keycloak 25.0.6 dev mode — admin/admin ─────────────────────────────────
  keycloak-test:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: mes-keycloak-test
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
