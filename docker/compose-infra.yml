services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  # Hosts the `mes` database (schema `iam` owned by iam-service).
  # Keycloak uses its own embedded H2 in dev mode (start-dev below).
  # For production, provision a separate Keycloak PostgreSQL instance.
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: ${IAM_DB_USER:-iam_user}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set}
      WORK_ORDER_DB_USER: ${WORK_ORDER_DB_USER:?WORK_ORDER_DB_USER must be set}
      WORK_ORDER_DB_PASSWORD: ${WORK_ORDER_DB_PASSWORD:?WORK_ORDER_DB_PASSWORD must be set}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:?INVENTORY_DB_USER must be set}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set}
      ENGINEERING_DB_USER: ${ENGINEERING_DB_USER:?ENGINEERING_DB_USER must be set}
      ENGINEERING_DB_PASSWORD: ${ENGINEERING_DB_PASSWORD:?ENGINEERING_DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAM_DB_USER:-iam_user} -d mes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mes-net

  # ── Apache Kafka 3.7 (KRaft — no Zookeeper) ──────────────────────────────────
  kafka:
    image: apache/kafka:3.7.1
    container_name: mes-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mes-net

  # ── Keycloak 25.0.6 ──────────────────────────────────────────────────────────
  # Dev mode (H2 embedded). Import mes-realm.json on first startup.
  # After import, set client secrets via the admin console or the post-import
  # script (see docs/keycloak-post-import.md).
  #
  # The http-sender webhook secret (KEYCLOAK_WEBHOOK_SECRET) must be set
  # in Keycloak after first import:
  #   Realm Settings → Events → http-sender provider → sharedSecret
  # Or configure via the Admin REST API (see .env.example for details).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: mes-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_LOG_LEVEL: INFO
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KEYCLOAK_AUDIT_KAFKA_BOOTSTRAP_SERVERS: ${KEYCLOAK_AUDIT_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KEYCLOAK_AUDIT_KAFKA_TOPIC: ${KEYCLOAK_AUDIT_KAFKA_TOPIC:-mes.audit.events}
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/mes-realm.json:/opt/keycloak/data/import/mes-realm.json:ro
      - ../libs/lib-keycloak-audit-spi/build/libs/lib-keycloak-audit-spi.jar:/opt/keycloak/providers/lib-keycloak-audit-spi.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000' 2>/dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - mes-net

  # ── IAM Service ─────────────────────────────────────────────────────────────
  iam-service:
    build:
      context: ..
      dockerfile: services/iam-service/Dockerfile
    container_name: mes-iam-service
    restart: unless-stopped
    environment:
      IAM_DB_URL: ${IAM_DB_URL:-jdbc:postgresql://postgres:5432/mes?currentSchema=iam}
      IAM_DB_USER: ${IAM_DB_USER:-iam_user}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:?KEYCLOAK_WEBHOOK_SECRET must be set}
      IAM_WEBHOOK_TOKEN: ${IAM_WEBHOOK_TOKEN:?IAM_WEBHOOK_TOKEN must be set}
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_SERVICE_URL: http://admin-service:8888
    ports:
      - "8081:8085"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Gateway Service ──────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: ..
      dockerfile: services/gateway-service/Dockerfile
    container_name: mes-gateway-service
    restart: unless-stopped
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      ADMIN_SERVICE_URL: http://admin-service:8888
      PLATFORM_SERVICE_URL: http://platform-service:8090
      AUDIT_SERVICE_URL: http://audit-service:8091
      WORK_ORDER_SERVICE_URL: http://work-order-service:8095
      INVENTORY_SERVICE_URL: http://inventory-service:8096
      ENGINEERING_SERVICE_URL: http://engineering-service:8097
      LABOUR_SERVICE_URL: http://labour-service:8098
      QUALITY_SERVICE_URL: http://quality-service:8099
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${GATEWAY_PORT:-8082}:8082"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Admin Service (Spring Boot Admin) ───────────────────────────────────────
  admin-service:
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
    container_name: mes-admin-service
    restart: unless-stopped
    environment:
      ADMIN_SERVICE_CLIENT_SECRET: ${ADMIN_SERVICE_CLIENT_SECRET:?ADMIN_SERVICE_CLIENT_SECRET must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
    ports:
      - "8888:8888"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Platform Service ─────────────────────────────────────────────────────────
  platform-service:
    build:
      context: ..
      dockerfile: services/platform-service/Dockerfile
    container_name: mes-platform-service
    restart: unless-stopped
    environment:
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=platform
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:?PLATFORM_DB_USER must be set}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
      IAM_SERVICE_URL: http://iam-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Audit Service ─────────────────────────────────────────────────────────────
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    container_name: audit-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUDIT_DB_NAME: mes
      AUDIT_SERVICE_DB_USERNAME: ${AUDIT_SERVICE_DB_USERNAME:?AUDIT_SERVICE_DB_USERNAME must be set}
      AUDIT_SERVICE_DB_PASSWORD: ${AUDIT_SERVICE_DB_PASSWORD:?AUDIT_SERVICE_DB_PASSWORD must be set}
      AUDIT_FLYWAY_DB_USERNAME: ${AUDIT_FLYWAY_DB_USERNAME:?AUDIT_FLYWAY_DB_USERNAME must be set}
      AUDIT_FLYWAY_DB_PASSWORD: ${AUDIT_FLYWAY_DB_PASSWORD:?AUDIT_FLYWAY_DB_PASSWORD must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_KAFKA_CONSUMER_GROUP: audit-service-group
      AUDIT_HEALTH_KAFKA_LAG_THRESHOLD: ${AUDIT_HEALTH_KAFKA_LAG_THRESHOLD:-1000}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      SPRING_BOOT_ADMIN_URL: http://admin-service:8888
      AUDIT_SERVICE_URL: http://audit-service:8091
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Work Order Service ────────────────────────────────────────────────────────
  work-order-service:
    build:
      context: ..
      dockerfile: services/work-order-service/Dockerfile
    container_name: work-order-service
    restart: unless-stopped
    environment:
      WORK_ORDER_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=work_order
      WORK_ORDER_DB_USER: ${WORK_ORDER_DB_USER:?WORK_ORDER_DB_USER must be set}
      WORK_ORDER_DB_PASSWORD: ${WORK_ORDER_DB_PASSWORD:?WORK_ORDER_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Inventory Service (Item Master + BOM) ───────────────────────────────────
  inventory-service:
    build:
      context: ..
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=inventory
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:?INVENTORY_DB_USER must be set}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Engineering Service (ECO management) ───────────────────────────────────
  engineering-service:
    build:
      context: ..
      dockerfile: services/engineering-service/Dockerfile
    container_name: engineering-service
    restart: unless-stopped
    environment:
      ENGINEERING_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=engineering
      ENGINEERING_DB_USER: ${ENGINEERING_DB_USER:?ENGINEERING_DB_USER must be set}
      ENGINEERING_DB_PASSWORD: ${ENGINEERING_DB_PASSWORD:?ENGINEERING_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      LABOUR_SERVICE_URL: http://labour-service:8098
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
      # Work Instructions (MES-10): e-signature KC client + MinIO media store.
      MES_SIGNATURE_VERIFY_SECRET: ${MES_SIGNATURE_VERIFY_SECRET:?MES_SIGNATURE_VERIFY_SECRET must be set}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "8097:8097"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Labour Service (Labour Resources & Skills — ISA-95 Personnel) ──────────
  labour-service:
    build:
      context: ..
      dockerfile: services/labour-service/Dockerfile
    container_name: labour-service
    restart: unless-stopped
    environment:
      LABOUR_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=labour
      LABOUR_DB_USER: ${LABOUR_DB_USER:?LABOUR_DB_USER must be set}
      LABOUR_DB_PASSWORD: ${LABOUR_DB_PASSWORD:?LABOUR_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
    ports:
      - "8098:8098"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8098/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── Quality Service (Quality & Inspection Planning) ────────────────────────
  quality-service:
    build:
      context: ..
      dockerfile: services/quality-service/Dockerfile
    container_name: quality-service
    restart: unless-stopped
    environment:
      QUALITY_DB_URL: jdbc:postgresql://postgres:5432/mes?currentSchema=quality
      QUALITY_DB_USER: ${QUALITY_DB_USER:?QUALITY_DB_USER must be set}
      QUALITY_DB_PASSWORD: ${QUALITY_DB_PASSWORD:?QUALITY_DB_PASSWORD must be set}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/mes}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080/realms/mes}
      IAM_SERVICE_URL: http://iam-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8096
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MES_SECURITY_WEBHOOK_TOKEN: ${MES_SECURITY_WEBHOOK_TOKEN:?MES_SECURITY_WEBHOOK_TOKEN must be set}
      ADMIN_SERVICE_URL: http://admin-service:8888
    ports:
      - "8099:8099"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8099/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mes-net

  # ── MinIO (S3-compatible object store for Work Instructions media — MES-10) ──
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - minio-data:/data
    networks:
      - mes-net

volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local
  minio-data:
    driver: local

networks:
  mes-net:
    driver: bridge
